services:
  psql:
    image: postgres:18
    command: postgres
    env_file:
      - common.env
    environment:
      POSTGRES_USER: ${DB_SUPERUSER:?}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
    ports:
      - '8000:5432'
    volumes:
      - ../Database/init_database.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  authorization_service:
    build:
      context: ../AuthorizationService
      target: start
    env_file:
      - common.env
      - auth.env
    depends_on:
      psql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 -t 1 http://$$AUTH_HOST:$$AUTH_PORT/healthcheck | grep -qi 'status.*active'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend_server:
    build:
      context: ../CommandProjectBackend
      target: start
    env_file:
      - server.env
      - common.env
    ports:
      - '8080:8080'
    depends_on:
      authorization_service:
        condition: service_healthy
